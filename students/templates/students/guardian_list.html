{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Guardians
            </h3>

            <p class="text-muted mb-0">
                Manage guardian records and student relationships.
            </p>
        </div>

        <a
            href="{% url 'students:guardian_create' %}"
            class="btn btn-primary"
        >
            + Add Guardian
        </a>

    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-12 col-md-8">

                    <label class="form-label small fw-semibold">
                        Search Guardians
                    </label>

                    <input
                        type="search"
                        id="guardian-search"
                        class="form-control"
                        placeholder="Name, phone or email..."
                        value="{{ search }}"
                        autocomplete="off"
                    >

                </div>

                <div class="col-12 col-md-3">

                    <label class="form-label small fw-semibold">
                        Status
                    </label>

                    <select
                        id="guardian-status"
                        class="form-select"
                    >

                        <option value="">
                            All statuses
                        </option>

                        <option
                            value="active"
                            {% if selected_status == "active" %}selected{% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="inactive"
                            {% if selected_status == "inactive" %}selected{% endif %}
                        >
                            Inactive
                        </option>

                    </select>

                </div>

                <div class="col-12 col-md-1 d-flex align-items-end">

                    <button
                        id="guardian-reset"
                        type="button"
                        class="btn btn-outline-secondary w-100"
                    >
                        Reset
                    </button>

                </div>

            </div>

            <div
                id="guardian-loading"
                class="small text-muted mt-3 d-none"
            >
                Searching...
            </div>

        </div>

    </div>

    <!-- Results -->
    <div id="guardian-results">

        {% include "students/partials/guardian_results.html" %}

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const searchInput =
        document.getElementById("guardian-search");

    const statusSelect =
        document.getElementById("guardian-status");

    const resetButton =
        document.getElementById("guardian-reset");

    const results =
        document.getElementById("guardian-results");

    const loading =
        document.getElementById("guardian-loading");

    let timer = null;
    let controller = null;

    function loadGuardians() {

        const search = searchInput.value.trim();
        const status = statusSelect.value;

        const params = new URLSearchParams();

        if (search) {
            params.set("search", search);
        }

        if (status) {
            params.set("status", status);
        }

        if (controller) {
            controller.abort();
        }

        controller = new AbortController();

        loading.classList.remove("d-none");

        fetch(
            `${window.location.pathname}?${params.toString()}`,
            {
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                },
                signal: controller.signal
            }
        )
        .then(response => {

            if (!response.ok) {
                throw new Error("Request failed");
            }

            return response.text();

        })
        .then(html => {

            results.innerHTML = html;

            const newUrl =
                params.toString()
                ? `${window.location.pathname}?${params.toString()}`
                : window.location.pathname;

            window.history.replaceState(
                {},
                "",
                newUrl
            );

        })
        .catch(error => {

            if (error.name !== "AbortError") {

                results.innerHTML = `
                    <div class="alert alert-danger m-3">
                        Could not load guardians.
                        Please try again.
                    </div>
                `;

            }

        })
        .finally(() => {
            loading.classList.add("d-none");
        });
    }

    searchInput.addEventListener(
        "input",
        function () {

            clearTimeout(timer);

            timer = setTimeout(
                loadGuardians,
                300
            );

        }
    );

    statusSelect.addEventListener(
        "change",
        loadGuardians
    );

    resetButton.addEventListener(
        "click",
        function () {

            searchInput.value = "";
            statusSelect.value = "";

            loadGuardians();

        }
    );

});
</script>

{% endblock %}
