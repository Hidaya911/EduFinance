{% extends "base.html" %}{% block content %}<div class="container py-4"><div class="card card-body mx-auto" style="max-width:760px"><div class="d-flex justify-content-between"><div><h2>Receipt</h2><strong>{{ receipt.receipt_number }}</strong></div><button onclick="window.print()" class="btn btn-outline-secondary d-print-none">Print</button></div><hr><p><strong>Student:</strong> {{ receipt.student.full_name }}</p><p><strong>Payment:</strong> {{ receipt.payment.payment_number }}</p><p><strong>Amount:</strong> {{ receipt.amount }}</p><p><strong>Issued:</strong> {{ receipt.issued_at }}</p><p><strong>Status:</strong> {{ receipt.get_status_display }}</p></div></div>{% endblock %}
