{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
<h2>Create Invoice</h2><form method="post" class="card card-body mt-3">{% csrf_token %}{{ form.non_field_errors }}<div class="row g-3">{% for f in form %}<div class="col-md-6"><label class="form-label">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary mt-3">Create Invoice</button></form>
</div>
{% endblock %}
