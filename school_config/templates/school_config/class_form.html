{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-3 px-md-4 py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-primary text-white">
                    <h6 class="m-0 font-weight-bold"><i class="fas fa-door-open me-2"></i> {{ action }} Class Section</h6>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Grade Level <span class="text-danger">*</span></label>
                            {{ form.grade }}
                            {% if form.grade.errors %}
                                <div class="text-danger small mt-1">{{ form.grade.errors.0 }}</div>
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Class Section Name <span class="text-danger">*</span></label>
                            {{ form.name }}
                            {% if form.name.errors %}
                                <div class="text-danger small mt-1">{{ form.name.errors.0 }}</div>
                            {% endif %}
                        </div>
                        <div class="mb-3 form-check">
                            {{ form.is_active }}
                            <label class="form-check-label fw-bold" for="{{ form.is_active.id_for_label }}">Active Status</label>
                        </div>
                        <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                            <a href="{% url 'school_config:classes_list' %}" class="btn btn-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save Class</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
