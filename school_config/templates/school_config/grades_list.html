{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-3 px-md-4 py-4">
    <div class="row mb-4 align-items-center">
        <div class="col-12 col-md-6">
            <h1 class="h3 mb-1 text-gray-800">School Grades</h1>
            <p class="text-muted small">Manage academic grade levels</p>
        </div>
        <div class="col-12 col-md-6 text-md-end mt-3 mt-md-0">
            <a href="{% url 'school_config:grade_create' %}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Add New Grade
            </a>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Grade Name</th>
                            <th>Description</th>
                            <th class="text-center" style="width: 180px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for grade in grades %}
                        <tr>
                            <td class="fw-bold">{{ grade.name }}</td>
                            <td>{{ grade.description|default:"--" }}</td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a href="{% url 'school_config:grade_edit' grade.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <a href="{% url 'school_config:grade_delete' grade.pk %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this grade?');">Delete</a>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center py-4 text-muted">No grades configured yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
