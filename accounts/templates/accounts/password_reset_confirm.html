{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password — EduFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { width: 100%; max-width: 400px; padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; background: white; }
        .btn-primary-custom { background-color: #1e50a2; border: none; width: 100%; padding: 0.6rem; }
    </style>
</head>
<body>
    <div class="card-custom">
        <h4 class="fw-bold mb-2">Set New Password</h4>
        <p class="text-muted small mb-4">Please enter and confirm your new password below.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">New Password</label>
                {{ form.new_password1 }}
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Confirm New Password</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="btn btn-primary-custom text-white fw-bold">Reset Password</button>
        </form>
    </div>
</body>
</html>
