{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Notification Preferences</h4>
                    <a href="{% url 'accounts:notifications_list' %}" class="btn btn-outline-secondary btn-sm">Back to Notifications</a>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3 form-check">
                            {{ form.email_notifications }}
                            <label class="form-check-label" for="{{ form.email_notifications.id_for_label }}">Receive Email Notifications</label>
                        </div>
                        <div class="mb-3 form-check">
                            {{ form.system_alerts }}
                            <label class="form-check-label" for="{{ form.system_alerts.id_for_label }}">Receive System Alerts</label>
                        </div>
                        <div class="mb-3 form-check">
                            {{ form.role_updates }}
                            <label class="form-check-label" for="{{ form.role_updates.id_for_label }}">Receive Role and Permission Update Alerts</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Preferences</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
